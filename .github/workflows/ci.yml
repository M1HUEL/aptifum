name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    name: lint / typecheck / build / test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: aptifum
          POSTGRES_PASSWORD: aptifum_dev
          POSTGRES_DB: aptifum_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aptifum"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: aptifum
      DB_PASSWORD: aptifum_dev
      DB_NAME: aptifum
      DB_NAME_TEST: aptifum_test
      JWT_ACCESS_SECRET: ci-access-secret-0123456789abcdef
      JWT_REFRESH_SECRET: ci-refresh-secret-0123456789abcdef
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_TTL: 7d
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5
        with:
          version: 11.20.0

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create app database
        run: PGPASSWORD=aptifum_dev psql -h localhost -U aptifum -d aptifum_test -c "CREATE DATABASE aptifum;"

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test API
        run: pnpm --filter @aptifum/api test:coverage

      - name: Test Web
        run: pnpm --filter @aptifum/web test:coverage

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browser
        run: pnpm --filter @aptifum/web exec playwright install --with-deps chromium

      - name: Test Web E2E
        run: pnpm --filter @aptifum/web test:e2e

      - name: Check OpenAPI drift
        run: |
          pnpm --filter @aptifum/web gen:api
          git diff --exit-code apps/web/src/api/schema.ts
